<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密货币套利机器人 - 实时仪表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .header-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-running {
            background: #d4edda;
            color: #155724;
        }
        
        .status-idle {
            background: #cfe2ff;
            color: #084298;
        }
        
        .status-error {
            background: #f8d7da;
            color: #842029;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .price-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .price-item:last-child {
            border-bottom: none;
        }
        
        .price-label {
            font-weight: 500;
            color: #666;
        }
        
        .price-value {
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
        }
        
        .price-up {
            color: #28a745;
        }
        
        .price-down {
            color: #dc3545;
        }
        
        .opportunity-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .opportunity-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #ffc107;
        }
        
        .opportunity-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .opportunity-crypto {
            color: #667eea;
            font-size: 16px;
        }
        
        .opportunity-rate {
            background: #fff3cd;
            color: #856404;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .opportunity-details {
            font-size: 12px;
            color: #666;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .opportunity-detail {
            background: white;
            padding: 5px;
            border-radius: 3px;
        }
        
        .detail-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #999;
        }
        
        .detail-value {
            font-weight: bold;
            color: #333;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .table th {
            background: #f8f9fa;
            padding: 10px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #dee2e6;
            color: #667eea;
        }
        
        .table td {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .table tr:hover {
            background: #f8f9fa;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        
        .alert-info {
            background: #cfe2ff;
            color: #084298;
            border: 1px solid #b6d4fe;
        }
        
        .alert-success {
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }
        
        .alert-warning {
            background: #fff3cd;
            color: #664d03;
            border: 1px solid #ffecb5;
        }
        
        .alert-danger {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }
        
        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 22px;
            }
            
            .header-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 加密货币套利机器人 - 实时仪表板</h1>
            <div class="header-info">
                <div class="info-card">
                    <div class="info-label">系统状态</div>
                    <div class="info-value">
                        <span class="status-badge status-running">运行中</span>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-label">最后更新</div>
                    <div class="info-value" id="lastUpdate">加载中...</div>
                </div>
                <div class="info-card">
                    <div class="info-label">套利机会</div>
                    <div class="info-value" id="opportunityCount">--</div>
                </div>
                <div class="info-card">
                    <div class="info-label">监控币种</div>
                    <div class="info-value" id="cryptoCount">--</div>
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="refreshData()">🔄 立即刷新</button>
                <button class="btn btn-secondary" onclick="toggleAutoRefresh()">⏸️ 自动刷新</button>
            </div>
        </div>
        
        <!-- 统计信息 -->
        <div class="grid">
            <div class="card">
                <h2>📊 统计数据</h2>
                <div class="stats-grid" id="statsContainer">
                    <div class="loading"><span class="spinner"></span></div>
                </div>
            </div>
            
            <div class="card">
                <h2>🚨 套利机会排行</h2>
                <div class="opportunity-list" id="opportunitiesList">
                    <div class="loading"><span class="spinner"></span></div>
                </div>
            </div>
        </div>
        
        <!-- 价格对比 -->
        <div class="card">
            <h2>💰 实时价格对比</h2>
            <div id="priceComparison">
                <div class="loading"><span class="spinner"></span></div>
            </div>
        </div>
        
        <!-- 币种详情 -->
        <div class="grid" id="cryptoDetails">
            <div class="loading"><span class="spinner"></span></div>
        </div>
    </div>
    
    <footer>
        <p>💼 加密货币多策略套利机器人 v1.0</p>
        <p>API: http://localhost:5000/api | 📧 联系支持</p>
    </footer>
    
    <script>
        let autoRefreshEnabled = true;
        let refreshInterval = null;
        
        // 格式化时间
        function formatTime(isoString) {
            if (!isoString) return '--';
            const date = new Date(isoString);
            return date.toLocaleTimeString('zh-CN');
        }
        
        // 格式化数字
        function formatNumber(num) {
            if (typeof num !== 'number') return '--';
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        // 获取状态
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('lastUpdate').textContent = formatTime(data.last_update);
                document.getElementById('opportunityCount').textContent = data.opportunities_count;
                document.getElementById('cryptoCount').textContent = data.cryptos_tracked;
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }
        
        // 获取统计数据
        async function loadStatistics() {
            try {
                const response = await fetch('/api/statistics');
                const data = await response.json();
                
                const statsHtml = `
                    <div class="stat-box">
                        <div class="stat-number">${data.total_opportunities}</div>
                        <div class="stat-label">套利机会</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${data.total_cryptos}</div>
                        <div class="stat-label">监控币种</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${data.max_diff_rate.toFixed(4)}%</div>
                        <div class="stat-label">最大差价</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${data.avg_diff_rate.toFixed(4)}%</div>
                        <div class="stat-label">平均差价</div>
                    </div>
                `;
                
                document.getElementById('statsContainer').innerHTML = statsHtml;
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        // 获取套利机会
        async function loadOpportunities() {
            try {
                const response = await fetch('/api/opportunities');
                const data = await response.json();
                
                if (data.opportunities.length === 0) {
                    document.getElementById('opportunitiesList').innerHTML = 
                        '<div class="alert alert-info">暂无套利机会 (差价 < 0.1%)</div>';
                    return;
                }
                
                const html = data.opportunities.map(opp => `
                    <div class="opportunity-item">
                        <div class="opportunity-header">
                            <span class="opportunity-crypto">${opp.crypto}</span>
                            <span class="opportunity-rate">${opp.diff_rate.toFixed(4)}%</span>
                        </div>
                        <div class="opportunity-details">
                            <div class="opportunity-detail">
                                <div class="detail-label">买入</div>
                                <div class="detail-value">${opp.buy_exchange}</div>
                                <div class="detail-value price-down">$${formatNumber(opp.buy_price)}</div>
                            </div>
                            <div class="opportunity-detail">
                                <div class="detail-label">卖出</div>
                                <div class="detail-value">${opp.sell_exchange}</div>
                                <div class="detail-value price-up">$${formatNumber(opp.sell_price)}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('opportunitiesList').innerHTML = html;
            } catch (error) {
                console.error('加载套利机会失败:', error);
            }
        }
        
        // 获取价格
        async function loadPrices() {
            try {
                const response = await fetch('/api/prices');
                const data = await response.json();
                
                let html = '<table class="table"><thead><tr><th>币种</th><th>交易所</th><th>价格 (USD)</th></tr></thead><tbody>';
                
                for (const [crypto, exchanges] of Object.entries(data.prices)) {
                    for (const [exchange, priceData] of Object.entries(exchanges)) {
                        if (priceData.price) {
                            html += `
                                <tr>
                                    <td><strong>${crypto}</strong></td>
                                    <td>${exchange}</td>
                                    <td class="price-value">$${formatNumber(priceData.price)}</td>
                                </tr>
                            `;
                        }
                    }
                }
                
                html += '</tbody></table>';
                document.getElementById('priceComparison').innerHTML = html;
            } catch (error) {
                console.error('加载价格失败:', error);
            }
        }
        
        // 手动刷新
        async function refreshData() {
            try {
                const response = await fetch('/api/refresh', { method: 'POST' });
                const data = await response.json();
                
                if (data.status === 'success') {
                    showAlert('✅ ' + data.message, 'success');
                    loadAllData();
                } else {
                    showAlert('❌ ' + data.message, 'danger');
                }
            } catch (error) {
                showAlert('❌ 刷新失败: ' + error.message, 'danger');
            }
        }
        
        // 显示提示
        function showAlert(message, type) {
            // 可以改进为使用 toast 通知
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        // 切换自动刷新
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            if (autoRefreshEnabled) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }
        
        // 启动自动刷新
        function startAutoRefresh() {
            refreshInterval = setInterval(loadAllData, 60000); // 每 60 秒刷新一次
        }
        
        // 停止自动刷新
        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        }
        
        // 加载所有数据
        async function loadAllData() {
            await loadStatus();
            await loadStatistics();
            await loadOpportunities();
            await loadPrices();
        }
        
        // 初始化
        window.addEventListener('load', () => {
            loadAllData();
            startAutoRefresh();
        });
    </script>
</body>
</html>
