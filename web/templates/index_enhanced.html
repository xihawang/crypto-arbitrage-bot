<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密货币套利机器人 v2.0 - 增强仪表板</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 28px;
        }
        
        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-online {
            background: #10b981;
            color: white;
        }
        
        .status-scanning {
            background: #f59e0b;
            color: white;
        }
        
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        
        .card-title {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .card-subtext {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px;
        }
        
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            height: 400px;
        }
        
        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f3f4f6;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        tr:hover {
            background: #f9fafb;
        }
        
        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge-opportunity {
            background: #dbeafe;
            color: #0369a1;
        }
        
        .badge-high {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .badge-medium {
            background: #fef3c7;
            color: #d97706;
        }
        
        .badge-low {
            background: #dcfce7;
            color: #16a34a;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            background: none;
            color: #6b7280;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .alert-info {
            background: #dbeafe;
            color: #0369a1;
            border-left: 4px solid #0369a1;
        }
        
        .alert-success {
            background: #dcfce7;
            color: #16a34a;
            border-left: 4px solid #16a34a;
        }
        
        .alert-warning {
            background: #fef3c7;
            color: #d97706;
            border-left: 4px solid #d97706;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border-left: 4px solid #dc2626;
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
            
            .chart-container {
                height: 300px;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部头部 -->
        <div class="header">
            <div>
                <h1>💰 加密货币套利机器人 v2.0</h1>
                <p style="color: #9ca3af; margin-top: 5px;">WebSocket 实时仪表板</p>
            </div>
            <div class="header-info">
                <div class="status-badge status-online">
                    <span class="pulse"></span>
                    <span id="connection-status">已连接</span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="refreshData()">🔄 刷新</button>
                    <button class="btn btn-success" onclick="toggleAutoRefresh()">⏱️ 自动更新</button>
                </div>
            </div>
        </div>
        
        <!-- 快速指标卡 -->
        <div class="grid">
            <div class="card">
                <div class="card-title">🎯 套利机会</div>
                <div class="card-value" id="opportunities-count">0</div>
                <div class="card-subtext">发现的套利机会总数</div>
            </div>
            
            <div class="card">
                <div class="card-title">📊 监控币种</div>
                <div class="card-value" id="cryptos-count">0</div>
                <div class="card-subtext">正在追踪的加密货币</div>
            </div>
            
            <div class="card">
                <div class="card-title">📈 最大差价率</div>
                <div class="card-value" id="max-diff-rate">0%</div>
                <div class="card-subtext">当前最高套利机会</div>
            </div>
            
            <div class="card">
                <div class="card-title">⏱️ 最后更新</div>
                <div class="card-value" id="last-update" style="font-size: 16px;">-</div>
                <div class="card-subtext">
                    <span id="scan-status">待扫描</span>
                </div>
            </div>
        </div>
        
        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('opportunities')">🚨 套利机会</button>
            <button class="tab" onclick="switchTab('prices')">💹 价格数据</button>
            <button class="tab" onclick="switchTab('analytics')">📊 数据分析</button>
            <button class="tab" onclick="switchTab('settings')">⚙️ 设置</button>
        </div>
        
        <!-- 套利机会标签页 -->
        <div id="tab-opportunities" class="tab-content active">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>币种</th>
                            <th>买入交易所</th>
                            <th>买入价格</th>
                            <th>卖出交易所</th>
                            <th>卖出价格</th>
                            <th>差价率 (%)</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="opportunities-table">
                        <tr class="loading">
                            <td colspan="8">
                                <div class="spinner"></div>
                                <p>加载中...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 价格数据标签页 -->
        <div id="tab-prices" class="tab-content">
            <div class="chart-container">
                <canvas id="prices-chart"></canvas>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>币种</th>
                            <th>交易所</th>
                            <th>价格 (USD)</th>
                            <th>时间戳</th>
                        </tr>
                    </thead>
                    <tbody id="prices-table">
                        <tr class="loading">
                            <td colspan="4">
                                <div class="spinner"></div>
                                <p>加载中...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 数据分析标签页 -->
        <div id="tab-analytics" class="tab-content">
            <div class="grid">
                <div class="card">
                    <div class="card-title">📈 平均差价率</div>
                    <div class="card-value" id="avg-diff-rate">0%</div>
                </div>
                <div class="card">
                    <div class="card-title">📊 最小差价率</div>
                    <div class="card-value" id="min-diff-rate">0%</div>
                </div>
                <div class="card">
                    <div class="card-title">🎯 扫描状态</div>
                    <div class="card-value" id="current-scan-status" style="font-size: 20px;">-</div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="analytics-chart"></canvas>
            </div>
        </div>
        
        <!-- 设置标签页 -->
        <div id="tab-settings" class="tab-content">
            <div class="card">
                <h3>系统设置</h3>
                <div style="margin-top: 20px;">
                    <label>
                        <input type="checkbox" id="auto-refresh" checked> 自动刷新数据
                    </label>
                    <div style="margin-top: 10px; color: #6b7280; font-size: 14px;">
                        每30秒自动扫描一次价格和套利机会
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <label>
                        <input type="checkbox" id="enable-notifications" checked> 启用通知
                    </label>
                    <div style="margin-top: 10px; color: #6b7280; font-size: 14px;">
                        发现套利机会时显示通知
                    </div>
                </div>
                <div style="margin-top: 30px;">
                    <button class="btn btn-primary" onclick="exportData()">📥 导出数据</button>
                    <button class="btn btn-secondary" onclick="clearData()">🗑️ 清空缓存</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ========== WebSocket 连接 ==========
        const socket = io();
        let pricesChart = null;
        let analyticsChart = null;
        let autoRefresh = true;
        
        socket.on('connect', function() {
            console.log('✅ WebSocket 连接成功');
            document.getElementById('connection-status').textContent = '已连接';
            subscribeToUpdates();
        });
        
        socket.on('disconnect', function() {
            console.log('❌ WebSocket 连接断开');
            document.getElementById('connection-status').textContent = '已断开';
        });
        
        socket.on('price_update', function(data) {
            console.log('📊 收到价格更新', data);
            updateUI(data);
        });
        
        // ========== 数据更新 ==========
        
        function subscribeToUpdates() {
            socket.emit('subscribe_prices');
        }
        
        function updateUI(data) {
            // 更新快速指标
            document.getElementById('opportunities-count').textContent = data.opportunities_count || 0;
            document.getElementById('last-update').textContent = new Date(data.timestamp).toLocaleTimeString('zh-CN');
            
            // 更新套利机会表格
            updateOpportunitiesTable(data.opportunities);
            
            // 更新统计数据
            fetchStatistics();
        }
        
        function updateOpportunitiesTable(opportunities) {
            const tbody = document.getElementById('opportunities-table');
            
            if (!opportunities || opportunities.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #9ca3af;">暂无套利机会</td></tr>';
                return;
            }
            
            // 按差价率排序
            opportunities.sort((a, b) => b.diff_rate - a.diff_rate);
            
            tbody.innerHTML = opportunities.map(opp => `
                <tr>
                    <td><strong>${opp.crypto}</strong></td>
                    <td>${opp.buy_exchange}</td>
                    <td>$${opp.buy_price.toFixed(2)}</td>
                    <td>${opp.sell_exchange}</td>
                    <td>$${opp.sell_price.toFixed(2)}</td>
                    <td>
                        <span class="badge ${opp.diff_rate > 0.3 ? 'badge-high' : opp.diff_rate > 0.2 ? 'badge-medium' : 'badge-low'}">
                            ${opp.diff_rate.toFixed(4)}%
                        </span>
                    </td>
                    <td><span class="badge badge-opportunity">检测中</span></td>
                    <td>
                        <button class="btn btn-primary" onclick="executeArbitrage('${opp.crypto}')">执行</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function fetchStatistics() {
            axios.get('/api/v2/statistics')
                .then(response => {
                    const stats = response.data;
                    document.getElementById('cryptos-count').textContent = stats.total_cryptos;
                    document.getElementById('max-diff-rate').textContent = stats.max_diff_rate.toFixed(4) + '%';
                    document.getElementById('avg-diff-rate').textContent = stats.avg_diff_rate.toFixed(4) + '%';
                    document.getElementById('min-diff-rate').textContent = stats.min_diff_rate.toFixed(4) + '%';
                    document.getElementById('current-scan-status').textContent = stats.scan_status === 'idle' ? '✅ 就绪' : '🔄 扫描中';
                })
                .catch(err => console.error('❌ 获取统计数据失败:', err));
        }
        
        // ========== 标签页切换 ==========
        
        function switchTab(tabName) {
            // 隐藏所有标签页
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            
            // 移除所有标签按钮的活跃状态
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.remove('active');
            });
            
            // 显示选中的标签页
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // 标记选中的标签
            event.target.classList.add('active');
            
            // 如果是价格标签页，初始化图表
            if (tabName === 'prices' && !pricesChart) {
                initPricesChart();
            }
            
            // 如果是分析标签页，初始化分析图表
            if (tabName === 'analytics' && !analyticsChart) {
                initAnalyticsChart();
            }
        }
        
        function initPricesChart() {
            const ctx = document.getElementById('prices-chart').getContext('2d');
            pricesChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['BTC', 'ETH', 'SOL'],
                    datasets: [
                        {
                            label: '币安',
                            data: [0, 0, 0],
                            backgroundColor: 'rgba(102, 126, 234, 0.7)'
                        },
                        {
                            label: 'Coinbase',
                            data: [0, 0, 0],
                            backgroundColor: 'rgba(16, 185, 129, 0.7)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: '主要交易所价格对比'
                        }
                    }
                }
            });
        }
        
        function initAnalyticsChart() {
            const ctx = document.getElementById('analytics-chart').getContext('2d');
            analyticsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'],
                    datasets: [
                        {
                            label: '平均差价率 (%)',
                            data: [0.1, 0.15, 0.12, 0.18, 0.22, 0.19],
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: '套利机会趋势'
                        }
                    }
                }
            });
        }
        
        // ========== 工具函数 ==========
        
        function refreshData() {
            console.log('🔄 手动刷新数据...');
            axios.post('/api/v2/refresh')
                .then(response => {
                    alert('✅ ' + response.data.message);
                })
                .catch(err => alert('❌ 刷新失败: ' + err.message));
        }
        
        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            console.log('⏱️ 自动更新:', autoRefresh ? '启用' : '禁用');
        }
        
        function executeArbitrage(crypto) {
            alert(`🚀 执行 ${crypto} 套利交易 (此功能需要配置 API 密钥)`);
        }
        
        function exportData() {
            alert('📥 数据导出功能将在下一版本实现');
        }
        
        function clearData() {
            if (confirm('确定要清空缓存吗?')) {
                localStorage.clear();
                alert('✅ 缓存已清空');
            }
        }
        
        // ========== 初始化 ==========
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 页面加载完成，初始化 WebSocket...');
            fetchStatistics();
            
            // 设置自动刷新
            setInterval(() => {
                if (autoRefresh) {
                    subscribeToUpdates();
                }
            }, 30000);
        });
    </script>
</body>
</html>
