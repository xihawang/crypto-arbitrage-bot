version: '3.8'

services:
  # 主应用服务
  crypto-arbitrage-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-arbitrage-bot
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - AUTO_TRADE_ENABLED=${AUTO_TRADE_ENABLED:-False}
      - SIMULATION_MODE=${SIMULATION_MODE:-True}
      - DRY_RUN=${DRY_RUN:-True}
      - MIN_PROFIT_THRESHOLD=${MIN_PROFIT_THRESHOLD:-0.01}
      - MAX_TRADE_SIZE=${MAX_TRADE_SIZE:-1000}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - COINBASE_API_KEY=${COINBASE_API_KEY}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - KRAKEN_API_SECRET=${KRAKEN_API_SECRET}
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_API_SECRET=${OKX_API_SECRET}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET}
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_PASSPHRASE=${BITGET_PASSPHRASE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-False}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - ALERT_ENABLED=${ALERT_ENABLED:-True}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # 持久化数据目录
      - bot-data:/app/data
      - bot-logs:/app/logs
      # 配置文件
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - crypto-bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Nginx反向代理（可选）- 需要手动启用
  # nginx:
  #   image: nginx:alpine
  #   container_name: crypto-arbitrage-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - crypto-arbitrage-bot
  #   networks:
  #     - crypto-bot-network
  #   restart: unless-stopped

volumes:
  bot-data:
    driver: local
  bot-logs:
    driver: local

networks:
  crypto-bot-network:
    driver: bridge
